name: offline-runtime-smoke

on:
  pull_request:
    paths:
      - 'client-unity/**'
      - 'scripts/validate-offline-runtime-smoke.py'
      - '.github/workflows/offline-runtime-smoke.yml'

permissions:
  contents: read
  checks: write

jobs:
  contract:
    name: Validate offline runtime smoke contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-offline-core.py
      - run: python scripts/validate-offline-gameplay.py
      - run: python scripts/validate-offline-screens.py
      - run: python scripts/validate-offline-runtime-smoke.py

  unity-editmode-smoke:
    name: Unity EditMode standalone smoke
    needs: contract
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify Unity license secrets
        shell: bash
        run: |
          test -n "$UNITY_LICENSE" || { echo '::error::UNITY_LICENSE secret is required'; exit 1; }
          test -n "$UNITY_EMAIL" || { echo '::error::UNITY_EMAIL secret is required'; exit 1; }
          test -n "$UNITY_PASSWORD" || { echo '::error::UNITY_PASSWORD secret is required'; exit 1; }
      - name: Run Unity EditMode smoke tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client-unity
          unityVersion: auto
          testMode: EditMode
          artifactsPath: artifacts/offline-smoke
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Offline Unity EditMode Smoke
      - name: Upload Unity smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-unity-smoke-${{ github.run_number }}
          path: artifacts/offline-smoke
          if-no-files-found: warn
          retention-days: 14
