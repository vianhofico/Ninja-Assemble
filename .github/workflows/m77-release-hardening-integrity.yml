name: m77-release-hardening-integrity
on:
  pull_request:
    paths:
      - 'server/**'
      - 'client-unity/Assets/Scripts/Game/Network/**'
      - 'client-unity/Assets/Scripts/Game/Settings/**'
      - 'client-unity/Assets/Scripts/Game/UI/Production/**'
      - 'game-data/release/m77-*'
      - 'docs/release/M77_*'
      - 'scripts/validate-m77-release-hardening.py'
      - '.github/workflows/m77-release-hardening-integrity.yml'
      - '.github/workflows/production-release-gate.yml'
jobs:
  validate-release-hardening-framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate M77 structural hardening
        run: python scripts/validate-m77-release-hardening.py
      - name: Run server regression and security token tests
        run: mvn -B -f server/pom.xml test
