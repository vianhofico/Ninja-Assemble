name: hero-progression-integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate-hero-progression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Frame Advance and Evolution contracts
        run: python scripts/validate-hero-progression.py
