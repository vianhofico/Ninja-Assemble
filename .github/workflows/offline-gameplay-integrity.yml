name: offline-gameplay-integrity
on:
  pull_request:
    paths:
      - 'client-unity/Assets/Scripts/Game/Playable/**'
      - 'client-unity/Assets/Tests/Editor/OfflineBattleSimulatorTests.cs'
      - 'scripts/validate-offline-gameplay.py'
      - '.github/workflows/offline-gameplay-integrity.yml'
jobs:
  validate-offline-gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-offline-core.py
      - run: python scripts/validate-offline-gameplay.py
