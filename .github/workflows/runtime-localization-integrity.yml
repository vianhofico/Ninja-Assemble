name: runtime-localization-integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate-runtime-localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bilingual runtime localization
        run: python scripts/validate-runtime-localization.py
