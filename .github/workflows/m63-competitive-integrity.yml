name: m63-competitive-integrity
on:
  pull_request:
    paths:
      - 'server/src/main/java/com/ninjaassemble/pvp/**'
      - 'server/src/main/resources/db/migration/V15__competitive_production.sql'
      - 'client-unity/Assets/Scripts/Game/Network/**'
      - 'client-unity/Assets/Scripts/Game/Playable/PlayableGameStore.cs'
      - 'scripts/validate-m63-competitive.py'
      - '.github/workflows/m63-competitive-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-competitive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-m63-competitive.py
