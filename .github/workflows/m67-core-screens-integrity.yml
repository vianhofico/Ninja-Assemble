name: m67-core-screens-integrity
on:
  pull_request:
    paths:
      - 'client-unity/Assets/Scripts/Game/UI/Production/**'
      - 'scripts/validate-m67-core-screens.py'
      - '.github/workflows/m67-core-screens-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-core-screens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/validate-m67-core-screens.py
