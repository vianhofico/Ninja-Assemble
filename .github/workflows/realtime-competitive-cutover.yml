name: Realtime Competitive Cutover

on:
  pull_request:
    paths:
      - 'server/src/main/java/com/ninjaassemble/battle/sim/**'
      - 'server/src/main/java/com/ninjaassemble/pvp/application/**'
      - 'client-unity/Assets/Scripts/Game/Network/**'
      - 'client-unity/Assets/Scripts/Game/Presentation/**'
      - 'scripts/validate-playable-arena.py'
      - 'scripts/validate-shadow-arena.py'
      - 'scripts/validate-realtime-competitive-cutover.py'
      - '.github/workflows/realtime-competitive-cutover.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-playable-arena.py
      - run: python scripts/validate-shadow-arena.py
      - run: python scripts/validate-realtime-competitive-cutover.py
