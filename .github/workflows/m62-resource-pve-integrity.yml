name: m62-resource-pve-integrity
on:
  pull_request:
    paths:
      - 'game-data/pve/**'
      - 'server/src/main/java/com/ninjaassemble/pve/**'
      - 'server/src/main/resources/db/migration/V14__resource_pve_runs.sql'
      - 'client-unity/Assets/Scripts/Game/Network/**'
      - 'client-unity/Assets/Scripts/Game/Playable/PlayableGameStore.cs'
      - 'scripts/validate-m62-resource-pve.py'
      - '.github/workflows/m62-resource-pve-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-resource-pve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-m62-resource-pve.py --enforce
