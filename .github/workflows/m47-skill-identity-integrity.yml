name: m47-skill-identity-integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-m47-skill-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate all Hero Version skill identities
        shell: bash
        run: |
          set +e
          output=$(python scripts/validate-m47-skill-identity.py 2>&1)
          code=$?
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            compact=$(printf '%s' "$output" | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=M47 Skill Identity::$compact"
            exit "$code"
          fi
      - name: Run focused runtime catalog tests
        working-directory: server
        run: mvn -B -Dtest=HeroContentCatalogServiceTest test
