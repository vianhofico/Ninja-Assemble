name: Playable Quality Integrity

on:
  pull_request:
    paths:
      - 'client-unity/Assets/Scripts/Game/Presentation/**'
      - 'scripts/validate-playable-quality.py'
      - '.github/workflows/playable-quality-integrity.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-playable-quality.py
