name: roster-formation-integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate-roster-formation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate playable roster/formation/detail loop
        run: python scripts/validate-roster-formation-flow.py
