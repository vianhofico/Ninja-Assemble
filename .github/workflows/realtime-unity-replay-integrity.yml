name: Realtime Unity Replay Integrity

on:
  pull_request:
    paths:
      - 'client-unity/Assets/Scripts/Game/Network/**'
      - 'client-unity/Assets/Scripts/Game/Playable/**'
      - 'client-unity/Assets/Scripts/Game/Presentation/**'
      - 'scripts/validate-realtime-unity-replay.py'
      - '.github/workflows/realtime-unity-replay-integrity.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate timestamped Unity replay cutover
        run: python scripts/validate-realtime-unity-replay.py
