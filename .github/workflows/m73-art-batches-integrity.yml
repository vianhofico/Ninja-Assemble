name: m73-art-batches-integrity
on:
  pull_request:
    paths:
      - 'art/**'
      - 'scripts/validate-art-batch-range.py'
      - 'scripts/validate-m73-art-batches.py'
      - '.github/workflows/m73-art-batches-integrity.yml'
      - 'docs/art/M73_ART_BATCHES_B31_B43.md'
      - 'docs/release/M73_STATUS.md'
jobs:
  validate-m73-batches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-m73-art-batches.py
