name: Offline Playtest Release

on:
  pull_request:
    paths:
      - 'client-unity/**'
      - '.github/workflows/offline-playtest-release.yml'
      - 'scripts/validate-offline-*.py'
      - 'README.md'
  push:
    branches:
      - main
    paths:
      - 'client-unity/**'
      - '.github/workflows/offline-playtest-release.yml'
      - 'scripts/validate-offline-*.py'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: offline-playtest-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate offline release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-offline-core.py
      - run: python scripts/validate-offline-gameplay.py
      - run: python scripts/validate-offline-screens.py
      - run: python scripts/validate-offline-runtime-smoke.py
      - run: python scripts/validate-offline-playtest-release.py

  smoke:
    name: Unity EditMode standalone smoke
    needs: contract
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Unity license secrets
        shell: bash
        run: |
          test -n "$UNITY_LICENSE" || { echo '::error::UNITY_LICENSE secret is required'; exit 1; }
          test -n "$UNITY_EMAIL" || { echo '::error::UNITY_EMAIL secret is required'; exit 1; }
          test -n "$UNITY_PASSWORD" || { echo '::error::UNITY_PASSWORD secret is required'; exit 1; }

      - name: Run Unity EditMode standalone smoke
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client-unity
          unityVersion: auto
          testMode: EditMode
          artifactsPath: artifacts/offline-smoke
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Offline Release Unity EditMode Smoke

      - name: Upload Unity smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-release-unity-smoke-${{ github.run_number }}
          path: artifacts/offline-smoke
          if-no-files-found: warn
          retention-days: 14

  build-apk:
    name: Build standalone offline APK
    needs: contract
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
      UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Unity license secrets
        shell: bash
        run: |
          test -n "$UNITY_LICENSE" || { echo '::error::UNITY_LICENSE secret is required'; exit 1; }
          test -n "$UNITY_EMAIL" || { echo '::error::UNITY_EMAIL secret is required'; exit 1; }
          test -n "$UNITY_PASSWORD" || { echo '::error::UNITY_PASSWORD secret is required'; exit 1; }

      - name: Build Android offline APK
        uses: game-ci/unity-builder@v5
        with:
          projectPath: client-unity
          unityVersion: auto
          targetPlatform: Android
          buildMethod: NinjaAssemble.EditorTools.MobileBuildAutomation.BuildAndroidDevelopment
          buildName: NinjaAssemble
          buildsPath: builds/android
          androidExportType: androidPackage
          versioning: Custom
          version: 0.1.${{ github.run_number }}
          androidVersionCode: ${{ github.run_number }}
          customParameters: -ninjaBuildCommit ${{ github.sha }}
          allowDirtyBuild: true

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail

          echo "Workspace: $GITHUB_WORKSPACE"
          echo "APK candidates produced by Unity/GameCI:"
          find "$GITHUB_WORKSPACE" -type f -name '*.apk' -size +0c -print || true
          echo "Metadata candidates:"
          find "$GITHUB_WORKSPACE" -type f -name 'build-metadata.json' -size +0c -print || true

          APK=""
          for candidate in \
            "$GITHUB_WORKSPACE/builds/android/NinjaAssemble.apk" \
            "$GITHUB_WORKSPACE/client-unity/builds/android/NinjaAssemble.apk"; do
            if [ -s "$candidate" ]; then
              APK="$candidate"
              break
            fi
          done
          if [ -z "$APK" ]; then
            APK="$(find "$GITHUB_WORKSPACE" -type f -name '*.apk' -size +0c -print -quit)"
          fi
          test -n "$APK" || { echo '::error::Unity build completed but no non-empty APK was found in the workspace'; exit 1; }

          METADATA="$(dirname "$APK")/build-metadata.json"
          if [ ! -s "$METADATA" ]; then
            METADATA="$(find "$GITHUB_WORKSPACE" -type f -name 'build-metadata.json' -size +0c -print -quit)"
          fi
          test -n "$METADATA" && test -s "$METADATA" || { echo '::error::No non-empty build-metadata.json was found'; exit 1; }

          RELEASE_DIR="$GITHUB_WORKSPACE/release/offline-playtest"
          mkdir -p "$RELEASE_DIR"
          cp "$APK" "$RELEASE_DIR/NinjaAssemble-offline-playtest.apk"
          cp "$METADATA" "$RELEASE_DIR/build-metadata.json"
          (
            cd "$RELEASE_DIR"
            sha256sum NinjaAssemble-offline-playtest.apk > SHA256SUMS.txt
          )

          test -s "$RELEASE_DIR/NinjaAssemble-offline-playtest.apk"
          test -s "$RELEASE_DIR/build-metadata.json"
          test -s "$RELEASE_DIR/SHA256SUMS.txt"
          ls -lh "$RELEASE_DIR"

      - name: Upload offline APK candidate
        uses: actions/upload-artifact@v4
        with:
          name: NinjaAssemble-offline-playtest-${{ github.run_number }}
          path: |
            release/offline-playtest/NinjaAssemble-offline-playtest.apk
            release/offline-playtest/build-metadata.json
            release/offline-playtest/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified offline playtest release
    needs:
      - smoke
      - build-apk
    if: github.event_name != 'pull_request' && needs.smoke.result == 'success' && needs.build-apk.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: NinjaAssemble-offline-playtest-${{ github.run_number }}
          path: release/offline-playtest

      - name: Verify downloaded release files
        shell: bash
        run: |
          set -euo pipefail
          test -s release/offline-playtest/NinjaAssemble-offline-playtest.apk
          test -s release/offline-playtest/build-metadata.json
          test -s release/offline-playtest/SHA256SUMS.txt
          (cd release/offline-playtest && sha256sum -c SHA256SUMS.txt)

      - name: Publish GitHub playtest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          TAG="offline-playtest-v${VERSION}"
          cat > /tmp/release-notes.md <<EOF
          ## Ninja Assemble Offline Playtest ${VERSION}

          Bản APK này dành cho **chơi thử offline trên Android**.

          - Không cần Java/Spring Boot server.
          - Không cần PostgreSQL hoặc Redis.
          - Không cần kết nối Internet cho gameplay offline.
          - Local save nằm trên thiết bị và có thể thay đổi/reset giữa các bản playtest.
          - Đây không phải production/store release và không phải bằng chứng production-art/device certification.

          Source commit: ${GITHUB_SHA}
          EOF
          gh release create "$TAG" \
            release/offline-playtest/NinjaAssemble-offline-playtest.apk \
            release/offline-playtest/build-metadata.json \
            release/offline-playtest/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Ninja Assemble Offline Playtest v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            --prerelease
