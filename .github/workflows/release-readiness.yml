name: release-readiness
on:
  workflow_dispatch:
    inputs:
      enforce:
        description: 'Fail the workflow if the private mobile release is not fully ready'
        required: false
        default: false
        type: boolean
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print release audit
        run: python scripts/release-audit.py --markdown
      - name: Generate art production queue
        run: python scripts/art-production-queue.py --output /tmp/art-production-queue.csv
      - name: Enforce release gates
        if: ${{ inputs.enforce }}
        run: python scripts/release-audit.py --enforce
