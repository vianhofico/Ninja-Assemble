name: production-release-gate
on:
  workflow_dispatch:
jobs:
  validate-production-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify server core
        run: |
          bash scripts/validate-core.sh
          mvn -B -f server/pom.xml test
      - name: Require evidence-backed reference profiles
        run: python scripts/validate-reference-evidence.py
      - name: Require final full-roster skill identity review
        run: python scripts/validate-m58-skill-identity.py --enforce
      - name: Require final full-roster realtime mechanics review
        run: python scripts/validate-m59-mechanics.py --enforce
      - name: Require final full-roster balance and presentation review
        run: python scripts/validate-m60-balance-presentation.py --enforce
      - name: Require production Campaign
        run: python scripts/validate-m61-campaign.py --enforce
      - name: Require production Resource PvE
        run: python scripts/validate-m62-resource-pve.py --enforce
      - name: Require production Arena and Shadow Arena
        run: python scripts/validate-m63-competitive.py
      - name: Require aggregate M74 parity verification
        run: python scripts/validate-m74-parity.py --enforce
      - name: Require certified M75 end-to-end reliability run
        run: python scripts/validate-m75-e2e.py --enforce
      - name: Require certified M76 Android performance and physical-device evidence
        run: python scripts/validate-m76-android-performance.py --enforce
      - name: Require full release readiness
        run: python scripts/validate-release-readiness.py --release
      - name: Require all hero art packages READY
        run: python scripts/validate-art-packages.py --release
      - name: Verify files behind READY art components
        run: python scripts/validate-production-assets.py
      - name: Enforce aggregate release audit
        run: python scripts/release-audit.py --enforce
