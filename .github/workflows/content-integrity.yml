name: content-integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate roster, variants, localization and art manifest
        run: python scripts/validate-content.py
