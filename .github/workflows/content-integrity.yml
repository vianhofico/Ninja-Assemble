name: content-integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate roster, variants, localization and art manifest
        run: python scripts/validate-content.py
      - name: Validate component-level art package states
        run: python scripts/validate-art-packages.py
      - name: Validate production files behind READY art components
        run: python scripts/validate-production-assets.py
      - name: Validate reference evidence confidence gates
        run: python scripts/validate-reference-evidence.py
      - name: Validate mobile scene source shell
        run: python scripts/validate-unity-shell.py
      - name: Validate Android build automation source
        run: python scripts/validate-mobile-build-source.py
      - name: Validate recorded mobile device evidence
        run: python scripts/validate-mobile-release-evidence.py
      - name: Generate full 427-variant art manifest candidate
        run: python scripts/generate-full-art-manifest.py --output /tmp/hero-art-manifest-full.csv
      - name: Generate full 427-variant component-status candidate
        run: python scripts/generate-full-art-component-status.py --output /tmp/hero-art-components-full.csv
      - name: Verify generated art candidates cover every variant census row
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          for path in (Path('/tmp/hero-art-manifest-full.csv'), Path('/tmp/hero-art-components-full.csv')):
              rows = list(csv.DictReader(path.open(encoding='utf-8')))
              keys = {(r['character_id'], r['variant']) for r in rows}
              if len(rows) != len(keys):
                  raise SystemExit(f'duplicate generated art keys in {path.name}')
              if len(rows) < 400:
                  raise SystemExit(f'expected full expanded art candidate, got {len(rows)} rows in {path.name}')
              print(f'FULL_ART_CANDIDATE_OK file={path.name} rows={len(rows)}')
          PY
