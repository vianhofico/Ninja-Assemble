name: guild-integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate-guild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate playable Guild loop
        run: python scripts/validate-playable-guild.py
