name: m72-art-batches-integrity
on:
  pull_request:
    paths:
      - 'art/**'
      - 'scripts/validate-art-batch-range.py'
      - 'scripts/validate-m72-art-batches.py'
      - '.github/workflows/m72-art-batches-integrity.yml'
      - 'docs/art/M72_ART_BATCHES_B21_B30.md'
      - 'docs/release/M72_STATUS.md'
jobs:
  validate-m72-batches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-m72-art-batches.py
