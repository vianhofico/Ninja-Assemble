name: release-readiness-integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate-playable-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate playable baseline completeness
        run: python scripts/validate-release-readiness.py
