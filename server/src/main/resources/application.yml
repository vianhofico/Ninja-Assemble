spring:
  application:
    name: ninja-assemble-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ninja_assemble}
    username: ${DB_USER:ninja}
    password: ${DB_PASSWORD:ninja}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
management:
  endpoints:
    web:
      exposure:
        include: health,info

game:
  clock:
    zone: ${GAME_TIME_ZONE:Asia/Bangkok}
    reset-hour: ${GAME_RESET_HOUR:5}
  energy:
    # Tunable until exact parity is measured against the frozen reference build.
    cap: ${GAME_ENERGY_CAP:120}
    regen-seconds: ${GAME_ENERGY_REGEN_SECONDS:300}
  dev:
    # Playtest-only cheat endpoints. Keep disabled in production.
    enabled: ${GAME_DEV_ENABLED:false}
