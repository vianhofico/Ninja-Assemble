services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ninja_assemble
      POSTGRES_USER: ninja
      POSTGRES_PASSWORD: ninja
    ports:
      - "5432:5432"
    volumes:
      - ninja_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ninja -d ninja_assemble"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ninja_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ninja_postgres:
  ninja_redis:
